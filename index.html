<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>App Lucas Zani</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lucas Zani">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1b1d22; --muted:#6b7280; --line:#e5e7eb;
  --side:#16181d; --side-ink:#c9ccd3; --side-hover:#23262d;
  --laranja:#ec9a3c; --amarelo:#f5d10f; --rosa:#ec7fa9; --azul:#5fa8f0;
  --verde:#22a06b; --vermelho:#e5484d;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color-scheme:light}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;height:100%}

/* ===== Topo / Abas ===== */
.topo{grid-column:1 / -1;display:flex;align-items:center;gap:24px;background:var(--side);color:#fff;padding:0 20px;height:60px;border-bottom:1px solid #2a2d35}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px;min-width:200px}
.marca .logo{width:34px;height:34px;border-radius:9px;background:var(--laranja);display:grid;place-items:center;color:#1b1d22;font-weight:800}
.abas{display:flex;gap:6px;height:100%;align-items:flex-end}
.aba{background:transparent;border:0;color:#a6aab3;padding:0 22px;height:44px;border-radius:10px 10px 0 0;font-weight:600;display:flex;align-items:center;gap:8px}
.aba:hover{color:#fff;background:#23262d}
.aba.ativa{background:var(--bg);color:var(--ink)}
.aba .bolinha{width:8px;height:8px;border-radius:50%;background:var(--laranja)}
.topo .direita{margin-left:auto;display:flex;align-items:center;gap:12px;color:#a6aab3}
.avatar{width:34px;height:34px;border-radius:50%;background:#2e323b;display:grid;place-items:center;color:#fff;font-weight:600}
.btn-menu{display:none;background:none;border:0;color:#fff;font-size:22px}

/* ===== Menu lateral ===== */
.lateral{background:var(--side);color:var(--side-ink);padding:16px 12px;overflow-y:auto}
.lateral .titulo{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b7080;padding:8px 12px}
.item{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:inherit;padding:11px 12px;border-radius:10px;text-align:left;font-weight:500}
.item:hover{background:var(--side-hover);color:#fff}
.item.ativo{background:var(--laranja);color:#1b1d22;font-weight:600}
.item svg{width:18px;height:18px;flex:none}
.item .cont{margin-left:auto;font-size:11px;background:#2e323b;color:#fff;border-radius:20px;padding:2px 8px}
.item.ativo .cont{background:#1b1d22}
.item .cont.alerta{background:var(--vermelho)}

/* ===== Conteúdo ===== */
.conteudo{overflow-y:auto;padding:28px 32px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.cab h1{margin:0;font-size:24px}
.cab p{margin:4px 0 0;color:var(--muted)}
.trilha{font-size:12px;color:var(--muted);margin-bottom:6px}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:600;background:var(--ink);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.peq{padding:5px 10px;font-size:12px}

.grade{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.cartao{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.cartao h3{margin:0 0 12px;font-size:15px}
.kpi .rot{color:var(--muted);font-size:12px;font-weight:500}
.kpi .val{font-size:24px;font-weight:700;margin-top:6px}
.kpi .det{font-size:12px;color:var(--muted);margin-top:4px}
.faixa{height:4px;border-radius:4px;margin-bottom:14px}

/* fluxo (setas do organograma) */
.fluxo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.etapa{padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;background:var(--amarelo)}
.etapa.lar{background:var(--laranja)}
.etapa.out{background:#fff;border:1px dashed #b9bdc6;color:var(--muted)}
.seta{color:#9ca3af;font-size:18px}

/* kanban negociação */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.coluna{background:#eceef2;border-radius:var(--radius);padding:12px;min-height:260px}
.coluna h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}
.coluna h4 span{color:var(--muted);font-weight:500}
.card-neg{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.card-neg b{display:block;font-size:13px}
.card-neg small{color:var(--muted);display:block;margin:3px 0 10px}
.card-neg .acoes{display:flex;gap:6px}
.card-neg .acoes button{flex:1;border:0;border-radius:7px;padding:6px;font-size:12px;font-weight:600}
.joia{background:#e6f6ee;color:var(--verde)}
.naojoia{background:#fdecec;color:var(--vermelho)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#f1f2f4;color:#444}
.tag.insta{background:#fbe7f1;color:#b4256b}

/* tabelas */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.status{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px}
/* sítio */
.sociedade{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;margin-bottom:16px;font-size:13px}
.sociedade>span:first-child{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:6px}
.sociedade input{width:60px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;font:inherit;text-align:center;margin:0 2px}
.sociedade .sep{color:var(--muted)}
.filtros{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.filtros label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.filtros select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff;min-width:150px}
.filtros-total{margin-left:auto;color:var(--muted);padding-bottom:8px}
.mes-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.mes-bar select{font:inherit;font-weight:600;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:220px;cursor:pointer}
.mes-bar .passo{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.mes-bar .passo:disabled{opacity:.35;cursor:default}
.no-mes{display:flex;gap:8px;align-items:flex-start;background:#fff7e6;border:1px solid #f3dfb0;color:#7a4b00;border-radius:8px;padding:9px 12px;margin:0 0 12px;font-size:13px}
.no-mes svg{width:16px;height:16px;flex:none;margin-top:1px}
tr.mes-sel td{background:#f3f7ff}
tr.linha-total td{border-top:2px solid var(--line)}
@media (max-width:760px){.mes-bar select{flex:1;min-width:0;font-size:16px;padding:10px 12px}.mes-bar .passo{width:44px;height:44px}}
.rolagem{overflow-x:auto}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.socio{font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px}
.s-lucas{background:#e6f0fd;color:#2b5fa8} .s-marcos{background:#fdeedd;color:#a35a00}
.cat-0{background:#eef0f3}.cat-1{background:#e6f6ee;color:#17734d}.cat-2{background:#f0f6e0;color:#55702a}.cat-3{background:#eae8fb;color:#4b3fa3}.cat-4{background:#fdeedd;color:#a35a00}.cat-5{background:#e6f0fd;color:#2b5fa8}
.cats{display:flex;flex-direction:column;gap:12px}
.cat-linha{display:grid;grid-template-columns:120px 1fr 110px 44px;align-items:center;gap:12px}
.cat-nome{font-weight:600}
.cat-barra{height:12px;background:#eceef2;border-radius:6px;overflow:hidden}
.cat-barra div{height:100%;background:var(--laranja);border-radius:6px}
.cat-valor{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.cat-pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi.saldo .det{color:var(--ink)}
@media (max-width:760px){.cat-linha{grid-template-columns:90px 1fr 90px}.cat-pct{display:none}.filtros-total{margin-left:0}}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-weight:500;max-width:min(380px,calc(100vw - 40px));box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toast-in .2s ease-out}
@keyframes toast-in{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.erro{color:var(--vermelho);font-weight:600;font-size:13px;margin:12px 0 0}
.alerta-suave{background:#fff6d6;color:#8a6d00;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:500;margin:0 0 14px}
.campos select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
.s-receber{background:#fff6d6;color:#8a6d00}
.s-recebido{background:#e6f6ee;color:var(--verde)}
.s-atrasado{background:#fdecec;color:var(--vermelho)}
.barra{height:8px;background:#eceef2;border-radius:6px;overflow:hidden}
.barra div{height:100%;background:var(--verde);border-radius:6px}
.venda{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.mudar-status{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.mudar-status>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.seletor{display:inline-flex;background:#f1f2f4;border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
.seletor button{border:0;background:transparent;border-radius:7px;padding:8px 16px;font-weight:600;color:var(--muted)}
.seletor button:hover{color:var(--ink)}
.seletor .op-disp.ativo{background:var(--verde);color:#fff}
.seletor .op-res.ativo{background:var(--amarelo);color:#1b1d22}
.seletor .op-vend.ativo{background:var(--vermelho);color:#fff}
.cliente-unid{display:flex;flex-direction:column;gap:5px;margin-top:12px;font-size:12px;font-weight:600;color:var(--muted);max-width:320px}
.cliente-unid input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.ico{width:14px;height:14px;vertical-align:-2px;flex:none}
.btn-menu .ico{width:22px;height:22px}
.fechar .ico{width:16px;height:16px;vertical-align:middle}
.aviso .ico{width:13px;height:13px}
.icone-vazio .ico{width:44px;height:44px;color:#9ca3af}
.divisao .taxa input{width:56px;margin:0 2px}
.divisao{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13px;margin:2px 0 10px}
.divisao small{color:var(--muted)}
/* negociação: corretor, captação e reunião */
.corretor-linha{display:flex;align-items:center;gap:6px;width:100%;margin-top:10px;background:#f1f4fb;border:0;border-radius:7px;padding:6px 8px;font-size:12px;font-weight:600;color:#2b4a8a;text-align:left}
.corretor-linha span{margin-left:auto;font-weight:500;color:var(--muted);font-size:11px}
.corretor-linha.espera{background:#fff6d6;color:#8a6d00;font-weight:600}
.captado{font-size:11px;color:var(--muted);margin-top:4px}
.reuniao{display:block;width:100%;margin-top:8px;border:1px dashed var(--laranja);background:#fff7ee;color:#a35a00;border-radius:7px;padding:7px 8px;font-size:12px;font-weight:600;text-align:left}
.reuniao.marcada{border-style:solid;background:#fff1de}
.reuniao small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
/* janelas de formulário */
.janela.form{width:min(520px,100%)}
.janela.form .janela-corpo{padding:24px}
.lista-cor{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.lista-cor label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer}
.lista-cor label:has(input:checked){border-color:var(--laranja);background:#fff7ee}
.lista-cor small{display:block;color:var(--muted);font-size:12px}
.lista-cor input{accent-color:var(--laranja)}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campos label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.campos .largo{grid-column:1 / -1}
.campos input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.participantes{display:flex;flex-direction:column;gap:6px}
.participantes span{background:#f7f8fa;border-radius:8px;padding:8px 10px;font-weight:600}
.participantes span.fixo{background:#fff1de}
.participantes small{font-weight:400;color:var(--muted);margin-left:4px}
.botoes{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.venda-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.taxa{font-size:12px;color:var(--muted);font-weight:600}
.taxa input{width:60px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;font:inherit;text-align:center}
.resumo{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
.resumo div{background:#f7f8fa;border-radius:9px;padding:10px}
.resumo span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.resumo b{font-size:14px}
.linha-paga td{color:var(--muted)}
.abrir{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f7f8fa;border:1px solid var(--line);border-radius:9px;padding:11px 14px;text-align:left;color:var(--ink);font-size:13px}
.abrir:hover{background:#eef0f3}
.abrir .seta-abrir{transition:transform .2s;font-size:14px}
.abrir.aberto .seta-abrir{transform:rotate(180deg)}
.cartao{overflow-x:auto}
@media (max-width:1100px){.resumo{grid-template-columns:repeat(3,1fr)}}
@media (max-width:760px){.resumo{grid-template-columns:1fr 1fr}}

/* sub-abas */
.subabas{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.subaba{background:none;border:0;padding:10px 16px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.subaba.ativa{color:var(--ink);border-color:var(--laranja)}

/* tarefas */
.tarefa{display:flex;align-items:center;gap:14px;padding:14px;border-radius:10px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
.tarefa input{width:18px;height:18px;accent-color:var(--verde)}
.tarefa .txt{flex:1}
.tarefa .txt small{display:block;color:var(--muted)}
.tarefa.atencao{background:#fffbe6;border-color:var(--amarelo)}
.tarefa.atrasada{background:#fdecec;border-color:var(--vermelho)}
.tarefa.feita{opacity:.55}
.tarefa.feita .txt b{text-decoration:line-through}
.aviso{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.aviso.atencao{background:var(--amarelo);color:#1b1d22}
.aviso.atrasada{background:var(--vermelho);color:#fff}

/* imóveis / unidades */
.foto{height:130px;border-radius:9px;margin:-4px -4px 12px;background:linear-gradient(135deg,#cfd6e0,#9aa7b8);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.unidades{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.unidade{border-radius:10px;padding:12px;border:1px solid var(--line);background:#fff}
.foto{position:relative;overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tipo{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.unidade{text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.unidade:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.unidade img{width:100%;height:90px;object-fit:cover;border-radius:7px;margin-bottom:8px;display:block;background:#dfe3e9}
.zap{display:inline-flex;align-items:center;gap:6px;background:#25d366;color:#fff;text-decoration:none;font-weight:600;font-size:12px;padding:6px 12px;border-radius:20px;white-space:nowrap}
.zap:hover{background:#1eb257}
.zap svg{width:15px;height:15px}
.zap.curto{padding:6px}
.fundo-janela{position:fixed;inset:0;background:rgba(10,12,16,.6);display:grid;place-items:center;z-index:50;padding:20px}
.janela{background:#fff;border-radius:16px;width:min(720px,100%);max-height:calc(100vh - 40px);overflow-y:auto;position:relative}
.janela .fechar{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:16px}
.janela-foto{position:relative;height:340px;background:#dfe3e9}
.janela-foto img{width:100%;height:100%;object-fit:cover;display:block}
.miniaturas{display:flex;gap:8px;padding:10px 16px 0}
.miniaturas button{border:2px solid transparent;border-radius:8px;padding:0;overflow:hidden;width:80px;height:56px;background:#dfe3e9}
.miniaturas button.ativa{border-color:var(--laranja)}
.miniaturas img{width:100%;height:100%;object-fit:cover;display:block}
.janela-corpo{padding:16px 20px 22px}
.info-unid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.info-unid div{background:#f7f8fa;border-radius:9px;padding:10px}
.info-unid span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.card-imovel{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer;transition:box-shadow .15s,border-color .15s}
.card-imovel:hover{border-color:#c9ced6;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card-imovel:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
.mini-info{font-size:12px;color:var(--muted);margin-bottom:10px}
.card-pe{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ver-det{font-size:12px;font-weight:600;color:var(--laranja)}
.tit-det{font-size:14px;margin:18px 0 8px}
.lista-det{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.lista-det li{position:relative;padding-left:16px;font-size:14px}
.lista-det li::before{content:"";position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--laranja)}
.chips-det{display:flex;flex-wrap:wrap;gap:6px}
.chips-det span{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;background:#f1f2f4;color:#333}
@media (max-width:760px){.lista-det{grid-template-columns:1fr}}
.venda-ok{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;padding:10px 12px;border-radius:8px;background:#e8f6ee;color:#1d6b40;font-size:13px;font-weight:600}
.venda-ok svg{width:16px;height:16px;flex:none;margin-top:1px}
.rot-campo{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}

// Preenche o que o app já sabe do cliente; o que não souber fica entre colchetes para completar
function preencherMensagem(texto, nomeCli){
  const c = clientePorNome(nomeCli) || { nome:nomeCli };
  const neg = estado.negocios.find(n=>n.cliente===c.nome);
  const venda = estado.vendas.find(v=>v.cliente===c.nome);
  const sugerido = c.busca ? (()=>{ const F = FILTRO_VAZIO(); Object.assign(F,{tipos:c.busca.tipos||[],vmin:c.busca.vmin??null,vmax:c.busca.vmax??null,quartos:c.busca.quartos||0}); return imoveisFiltrados(F)[0]; })() : null;
  const nomeIm = neg?.imovel || venda?.imovel || sugerido?.nome;
  const im = estado.imoveis.find(i=>i.nome===nomeIm) || sugerido;
  const prox = venda?.pagamentos.find(p=>!p.pago);
  const quando = neg?.reuniao?.quando;
  const mapa = {
    'nome': c.nome.split(' ')[0],
    'corretor': nomeCor(neg?.corretor || c.captador || 1),
    'imóvel': nomeIm,
    'endereço': im?.endereco,
    'valor': im ? real(im.valor) : null,
    'tipo': im ? categoriaImovel(im).toLowerCase() : null,
    'quartos': im?.quartos ? plural(im.quartos,'quarto','quartos') : null,
    'bairro': im ? bairroDe(im) : null,
    'empreendimento': estado.lancamentos[0]?.nome,
    'entrada': im ? real(Math.round(im.valor*0.2)) : null,
    'parcela': im ? real2(im.valor*0.8/24)+' em 24x' : null,
    'parcela nº': prox ? prox.nome.toLowerCase() : null,
    'vencimento': prox ? fmtData(prox.venc) : null,
    'valor da parcela': prox ? real2(prox.valor) : null,
    'data da reunião': quando ? fmtData(quando) : null,
    'hora da reunião': quando ? fmtHora(quando) : null,
  };
  return texto.replace(/\[([^\]]+)\]/g, (t,k) => mapa[k] || t);
}

/* ===================== VENDAS, PARCELAS E COMISSÃO ===================== */
// A comissão cai aos poucos: cada pagamento recebido (entrada ou parcela) libera a comissão relativa a ele.
function somaMeses(meses){ const d = new Date(agora); d.setDate(10); d.setMonth(d.getMonth()+meses); d.setHours(0,0,0,0); return d; }
function montarVenda({imovel,cliente,valor,entrada,parcelas,pagas=0,contrato='Contrato — / NF —',inicio=0,taxa=TAXA_PADRAO,vendedor=null,captador=null}){
  const pagamentos = [{ nome: parcelas ? 'Entrada' : 'Pagamento à vista', valor: entrada, venc: somaMeses(inicio), pago: pagas>0 }];
  if (parcelas){
    const resto = valor - entrada;
    const base = Math.floor(resto/parcelas*100)/100;
    for (let i=1;i<=parcelas;i++){
      const v = i===parcelas ? Math.round((resto - base*(parcelas-1))*100)/100 : base;
      pagamentos.push({ nome:`Parcela ${i}/${parcelas}`, valor:v, venc: somaMeses(inicio+i), pago: i < pagas });
    }
  }
  return { imovel, cliente, valor, contrato, taxa, pagamentos, vendedor, captador, taxaCaptacao:TAXA_CAPTACAO, data: somaMeses(inicio) };
}
/* controle mensal das comissões */
const NOMES_MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const chaveMes = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const nomeMes  = k => { const [a,m] = k.split('-'); return `${NOMES_MES[m-1]} de ${a}`; };
const mesAtualFin = () => estado.mesFin || chaveMes(agora);
function mesesFin(){
  const s = new Set([chaveMes(agora)]);
  estado.vendas.forEach(v=>{ s.add(chaveMes(v.data)); v.pagamentos.forEach(p=>s.add(chaveMes(p.venc))); });
  return [...s].sort();
}
function resumoMes(k){
  const vendas = estado.vendas.filter(v=>chaveMes(v.data)===k);
  const pags = estado.vendas.flatMap(v=>v.pagamentos.filter(p=>chaveMes(p.venc)===k).map(p=>({v,p})));
  const prevista = pags.reduce((s,{v,p})=>s+p.valor*v.taxa,0);
  const recebida = pags.filter(({p})=>p.pago).reduce((s,{v,p})=>s+p.valor*v.taxa,0);
  return { vendas, pags, comVendas: vendas.reduce((s,v)=>s+comTotal(v),0), prevista, recebida, aReceber: prevista-recebida };
}
// Quem captou o cliente leva uma parte da comissão, mesmo que não faça a venda.
const comCaptacao = v => (v.captador && v.captador!==v.vendedor) ? comTotal(v)*v.taxaCaptacao : 0;
const corretor = id => estado.corretores.find(c=>c.id===id);
const nomeCor  = id => corretor(id)?.nome || '—';
const clientePorNome = n => estado.clientes.find(c=>c.nome===n);
const carteira = id => estado.clientes.filter(c=>c.captador===id);
const comTotal    = v => v.valor * v.taxa;
const valRecebido = v => v.pagamentos.filter(p=>p.pago).reduce((s,p)=>s+p.valor,0);
const comRecebida = v => valRecebido(v) * v.taxa;
const comAReceber = v => comTotal(v) - comRecebida(v);
const quitada     = v => v.pagamentos.every(p=>p.pago);
const formaPag    = v => v.pagamentos.length===1 ? 'À vista' : `Entrada + ${v.pagamentos.length-1}x`;
const fmtData     = d => d.toLocaleDateString('pt-BR');
const real2       = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function situacaoPag(p){
  if (p.pago) return ['Pago','s-recebido'];
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if (p.venc < hoje) return ['Atrasado','s-atrasado'];
  return ['A receber','s-receber'];
}

/* ===================== ALERTAS DAS TAREFAS ===================== */
// rosa = falta até 60 min para a hora marcada; vermelho = passou da hora e não foi marcada como realizada
function situacao(t){
  if (t.feita) return 'feita';
  const diff = (t.quando - new Date())/60000;
  if (diff < 0) return 'atrasada';
  if (diff <= 60) return 'atencao';
  return 'normal';
}
const atrasadas = () => estado.tarefas.filter(t=>situacao(t)==='atrasada').length;

  const conts = { negociacao: estado.negocios.length, tarefas: estado.tarefas.filter(t=>!t.feita).length };
  $('#menu').innerHTML = MENU.map(m => {
    let c = '';

    else if (conts[m.id]) c = `<span class="cont">${conts[m.id]}</span>`;
    return `<button class="item ${m.id===estado.menu?'ativo':''}" data-menu="${m.id}">${m.icone}${m.nome}${c}</button>`;
  }).join('');
}

      <table class="mensal"><thead><tr><th>Mês</th><th>Vendas fechadas</th><th class="num">Comissão das vendas</th><th class="num">Comissão prevista</th><th class="num">Recebida</th><th class="num">A receber</th><th></th></tr></thead><tbody>
      ${lista.map(r=>`<tr class="${r.k===mes?'mes-sel':''}"><td><b>${nomeMes(r.k)}</b>${r.k===hoje?' <span class="status s-recebido">Mês atual</span>':''}</td>
        <td>${r.vendas.length || '—'}</td><td class="num">${real2(r.comVendas)}</td><td class="num">${real2(r.prevista)}</td>
        <td class="num"><b style="color:var(--verde)">${real2(r.recebida)}</b></td>
        <td class="num"><b style="color:${r.aReceber>0.005 && r.k<hoje ? 'var(--vermelho)' : '#b26b00'}">${real2(r.aReceber)}</b>${r.aReceber>0.005 && r.k<hoje?' <small style="color:var(--vermelho)">atrasada</small>':''}</td>
        <td><button class="btn sec peq" data-mes-ir="${r.k}">Ver mês</button></td></tr>`).join('')}
      <tr class="linha-total"><td><b>Total</b></td><td>${estado.vendas.length}</td><td class="num"><b>${real2(t('comVendas'))}</b></td><td class="num"><b>${real2(t('prevista'))}</b></td><td class="num"><b>${real2(t('recebida'))}</b></td><td class="num"><b>${real2(t('aReceber'))}</b></td><td></td></tr>
      </tbody></table>`;
    }

    const meses = mesesFin(), im = meses.indexOf(mes);
    const seletorMes = `<div class="mes-bar">
      <button class="passo" data-mes-passo="-1" aria-label="Mês anterior" ${!todos && im<=0?'disabled':''}>‹</button>
      <select data-mes-fin aria-label="Mês">
        ${meses.map(k=>`<option value="${k}" ${k===mes?'selected':''}>${nomeMes(k)}</option>`).join('')}
        <option value="todos" ${todos?'selected':''}>Todos os meses</option>
      </select>
      <button class="passo" data-mes-passo="1" aria-label="Próximo mês" ${!todos && im>=meses.length-1?'disabled':''}>›</button>
    </div>`;
    const kpis = todos ? `
      ${kpi('Comissão total das vendas', real2(soma(comTotal)), estado.vendas.length+' vendas', 'var(--amarelo)')}
      ${kpi('Comissão a receber', real2(soma(comAReceber)), 'cai conforme as parcelas são pagas', 'var(--laranja)')}
      ${kpi('Comissão recebida', real2(soma(comRecebida)), 'já liberada', 'var(--verde)')}` : `
      ${kpi('Comissão das vendas do mês', real2(R.comVendas), R.vendas.length ? R.vendas.length+' venda'+(R.vendas.length>1?'s':'')+' fechada'+(R.vendas.length>1?'s':'') : 'nenhuma venda fechada', 'var(--amarelo)')}
      ${kpi('Comissão a receber no mês', real2(R.aReceber), R.aReceber>0.005 && mes<chaveMes(agora) ? 'atrasada: pagamentos não recebidos' : 'parcelas que vencem no mês', R.aReceber>0.005 && mes<chaveMes(agora) ? 'var(--vermelho)' : 'var(--laranja)')}
      ${kpi('Comissão recebida no mês', real2(R.recebida), 'de '+real2(R.prevista)+' prevista no mês', 'var(--verde)')}`;

    return cab('Financeiro','Vendas, valores a receber, recebidos e comissões. A comissão é liberada a cada pagamento recebido.', `<button class="btn" data-acao="comissao">Gerar comissão</button>`) +
    fluxo([{t:'Contrato / Nota fiscal',c:'out'},'→','Vendas','→','A receber','→','Recebido']) + `
    ${seletorMes}
    <div class="grade g3" style="margin-bottom:16px">${kpis}</div>
    <div class="cartao">
      ${subabas('financeiro',[['vendas','Vendas'],['receber','A receber'],['recebido','Recebido'],['mensal','Por mês']],sub)}
      ${corpo}
    </div>`;
  },

  negociacao(){
    return cab('Negociação','Do primeiro contato ao fechamento do negócio. "Avançar" passa para a próxima etapa; "Descartar" manda para o Cadastro de interesse.', `<button class="btn" data-acao="novo-negocio">+ Novo interessado</button>`) +
    fluxo([{t:'Instagram',c:'out'},'→',...ETAPAS.flatMap((e,i)=>i?['→',e.nome]:[e.nome]),'→',{t:'Contrato / NF',c:'out'}]) + `
    <div class="etapas-chips" role="tablist" aria-label="Etapas da negociação">
      ${ETAPAS.map(e=>`<button role="tab" class="${estado.etapaMob===e.id?'ativa':''}" data-etapa-mob="${e.id}">${e.nome}<b>${estado.negocios.filter(n=>n.etapa===e.id).length}</b></button>`).join('')}
    </div>
    <div class="kanban">
      ${ETAPAS.map((e,idx)=>{const itens=estado.negocios.filter(n=>n.etapa===e.id);
        return `<div class="coluna ${estado.etapaMob===e.id?'mob-ativa':''}"><h4>${e.nome}<span>${itens.length}</span></h4>
        ${itens.length ? '' : '<p class="vazio-col">Nenhum cliente nesta etapa.</p>'}
        ${itens.map(n=>{
          const cap = clientePorNome(n.cliente)?.captador;
          const ultimo = idx===ETAPAS.length-1;
          return `<div class="card-neg"><b>${n.cliente}</b><small>${n.imovel}</small>
          <div style="display:flex;justify-content:space-between;align-items:center"><span class="tag ${n.origem==='Instagram'?'insta':''}">${n.origem}</span>${n.tel?zap(n.cliente,n.tel,true):''}</div>
          ${n.corretor
            ? `<button class="corretor-linha" data-encaminhar="${n.id}" title="Trocar corretor">${ICO.user} ${nomeCor(n.corretor)} <span>trocar</span></button>`
            : `<div class="corretor-linha espera">Aguardando encaminhamento do Lucas</div>`}
          ${cap ? `<div class="captado">Captado por ${nomeCor(cap)}</div>` : ''}
          ${ultimo ? (n.reuniao
            ? `<button class="reuniao marcada" data-reuniao="${n.id}">${ICO.cal} ${fmtData(n.reuniao.quando)} às ${fmtHora(n.reuniao.quando)}<small>${n.reuniao.local} · com Lucas</small></button>`
            : `<button class="reuniao" data-reuniao="${n.id}">${ICO.cal} Agendar reunião de fechamento</button>`) : ''}
          <div class="acoes" style="margin-top:10px">
            <button class="joia" data-avancar="${n.id}">${ultimo?'Fechar negócio':idx===0?'Encaminhar':'Avançar'}</button>
            <button class="naojoia" data-perder="${n.id}">Descartar</button>
          </div></div>`}).join('')}
        </div>`}).join('')}
    </div>
    <div class="cartao" style="margin-top:20px"><h3>Cadastro de interesse</h3>
      <p style="color:var(--muted);margin-top:-6px">Clientes que saíram do funil. Ficam guardados para oferecer outros imóveis depois.</p>
      <table><thead><tr><th>Cliente</th><th>Imóvel</th><th>Saiu na etapa</th><th>Motivo</th></tr></thead><tbody>
      ${estado.interesse.map(c=>`<tr><td>${c.cliente}</td><td>${c.imovel}</td><td>${c.saiuEm}</td><td>${c.motivo}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  },

  cadastro(){
    const sub = estado.sub.cadastro || 'clientes';
    let tabela;
    if (sub==='clientes') tabela = tab(['Nome','Telefone','Perfil','Carteira do corretor','Procura',''], estado.clientes.map(c=>[`<button class="link-cli" data-ficha="${esc(c.nome)}">${c.nome}</button>`,c.tel,c.perfil,
      c.captador ? `<span class="tag">${nomeCor(c.captador)}</span>` : '<small style="color:var(--muted)">Ainda não captado</small>',
      c.busca ? `<small>${textoBusca(c.busca)}</small><br><button class="btn sec peq" data-para-cliente="${c.nome}" style="margin-top:6px">Imóveis para este cliente</button>` : '<small style="color:var(--muted)">—</small>',
      `<div class="acoes-cli">${zap(c.nome,c.tel)}<button class="btn sec peq btn-msg" data-mensagens="${c.nome}">Mensagens</button></div>`]));
    if (sub==='corretor') tabela = `<p style="color:var(--muted);margin:0 0 12px">O cliente entra na carteira do corretor que o captou na visita. Se outro corretor fizer a venda, quem captou recebe ${TAXA_CAPTACAO*100}% da comissão.</p>` +
      tab(['Nome','CRECI','Função','Carteira de clientes','Em atendimento',''], estado.corretores.map(c=>{
        const cart = carteira(c.id), atend = estado.negocios.filter(n=>n.corretor===c.id).length;
        return [`<b>${c.nome}</b>${c.email?`<br><small style="color:var(--muted)">${c.email}</small>`:''}`, c.creci || '—', c.funcao,
          cart.length ? `<b>${cart.length}</b> <small style="color:var(--muted)">${cart.map(x=>x.nome).join(', ')}</small>` : '<small style="color:var(--muted)">Nenhum cliente</small>',
          atend, `<div class="acoes-cli">${zap(c.nome,c.tel)}<button class="btn sec peq" data-editar-cor="${c.id}">Editar</button></div>`];
      }));
    if (sub==='imoveis')  tabela = tab(['Imóvel','Tipo','Área','Valor','Status'], estado.imoveis.map(i=>[i.nome,i.tipo,i.area+' m²',real(i.valor),i.status]));
    const rot = {clientes:'cliente',corretor:'corretor',imoveis:'imóvel'}[sub];
    return cab('Cadastro','Clientes, corretores e imóveis.', `<button class="btn" data-acao="cadastrar">+ Cadastrar ${rot}</button>`) +
    `<div class="cartao">${subabas('cadastro',[['clientes','Clientes'],['corretor','Corretor'],['imoveis','Imóveis']],sub)}${tabela}</div>`;
  },

  imoveis(){
    const F = filtroImo(), lista = imoveisFiltrados(), tags = tagsFiltro(), n = qtdFiltros();
    const cli = F.paraCliente;
    return cab('Imóveis','Carteira de imóveis da imobiliária. Toque em um imóvel para ver os detalhes e mudar o status.', `<button class="btn" data-acao="novo-imovel">+ Cadastrar imóvel</button>`) + `
    ${cli ? `<div class="faixa-cliente">${ICO.user}<span>Imóveis para o perfil de <b>${cli}</b>: ${textoBusca(clientePorNome(cli)?.busca)}</span><button class="btn sec peq" data-limpar-filtros>Ver todos</button></div>` : ''}
    <div class="barra-filtros">
      <button class="btn sec btn-filtros" data-abrir-filtros>${ICO.filtro} Filtros${n?` <span class="qtd">${n}</span>`:''}</button>
      <label class="ordenar">Ordenar por <select data-ordem-imo>${ORDENS_IMO.map(([k,t])=>`<option value="${k}" ${F.ordem===k?'selected':''}>${t}</option>`).join('')}</select></label>
      <span class="total-filtro">${plural(lista.length,'imóvel','imóveis')}</span>
    </div>
    ${tags.length ? `<div class="tags-filtro">${tags.map(([t,k])=>`<button class="tag-filtro" data-tira-filtro="${k}" aria-label="Remover filtro ${t}">${t} ${ICO.x}</button>`).join('')}<button class="limpar-tudo" data-limpar-filtros>Limpar tudo</button></div>` : ''}
    ${!lista.length ? `<div class="cartao vazio-filtro"><b>Nenhum imóvel encontrado com esses filtros.</b><p>Tente tirar algum filtro ou ampliar a faixa de valor.</p><button class="btn sec" data-limpar-filtros>Limpar filtros</button></div>` : ''}
    <div class="grade g3">${lista.map(i=>{const ix = estado.imoveis.indexOf(i); return `<button class="cartao card-imovel" data-imovel="${ix}" aria-label="Ver detalhes: ${i.nome}">
      <div class="foto">${i.foto ? `<img src="${foto(i.foto,600)}" alt="" loading="lazy">` : `<span class="sem-foto">Sem foto</span>`}${i.videos?.length ? `<span class="tem-video">${ICO.video} ${i.videos.length}</span>` : ""}<span class="tipo">${categoriaImovel(i)}</span></div>
      <b>${i.nome}</b><div style="color:var(--muted);margin:4px 0 8px">${i.area} m² · ${real(i.valor)}</div>
      ${resumoImovel(i) ? `<div class="mini-info">${resumoImovel(i)}</div>` : ''}
      <div class="card-pe"><span class="status ${statusImovel(i.status)}">${i.status}</span><span class="ver-det">Ver detalhes ›</span></div></button>`}).join('')}</div>` + janelaImovel() + janelaFiltros();
  },

  tarefas(){
    const ord = [...estado.tarefas].sort((a,b)=>a.feita-b.feita || a.quando-b.quando);
    return cab('Tarefas','Lista de tarefas com avisos automáticos.', `<button class="btn" data-acao="nova-tarefa">+ Nova tarefa</button>`) + `
    <div class="legenda"><span><i style="background:var(--amarelo)"></i>Aviso de atenção: a hora marcada está chegando (menos de 1 h)</span>
      <span><i style="background:var(--vermelho)"></i>Alerta: passou da hora e não foi marcada como realizada</span></div>
    <div class="cartao">${ord.map(linhaTarefa).join('')}</div>`;
  },

  lancamentos(){
    return cab('Lançamentos','Vendas de imóveis na planta.', `<button class="btn" data-acao="novo-lancamento">+ Novo lançamento</button>`) +
    estado.lancamentos.map(l=>{
      const c = s=>l.unidades.filter(u=>u.st===s).length;
      return `<div class="cartao">
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
        <div class="foto" style="width:320px;max-width:100%;height:200px;margin:0"><img src="${foto(l.foto,800)}" alt="${l.nome}"></div>
        <div style="flex:1;min-width:220px"><h3 style="margin:0">${l.nome}</h3><div style="color:var(--muted);margin-top:4px">${l.endereco}<br>Entrega prevista: ${l.entrega} · ${l.unidades.length} unidades</div>
        <p style="margin:8px 0 0">${l.descricao}</p>
        <div style="margin-top:8px;display:flex;gap:8px"><span class="status s-recebido">${c('disp')} disponíveis</span><span class="status s-receber">${c('res')} reservadas</span><span class="status" style="background:#fdecec;color:var(--vermelho)">${c('vend')} vendidas</span></div></div>
      </div>
      <label class="sel-unid"><span>Unidades na planta</span>
        <select class="sel-f" data-sel-unidade="${estado.lancamentos.indexOf(l)}" aria-label="Escolher unidade de ${esc(l.nome)}">
          <option value="">Escolha uma unidade</option>
          ${Object.entries(ST_UNID).map(([st,nomeSt])=>{ const us = l.unidades.map((u,ui)=>[u,ui]).filter(([u])=>u.st===st); return us.length ? `<optgroup label="${({disp:'Disponíveis',res:'Reservadas',vend:'Vendidas'})[st]} (${us.length})">${us.map(([u,ui])=>`<option value="${ui}" ${estado.unidade && estado.unidade[0]===estado.lancamentos.indexOf(l) && estado.unidade[1]===ui ? 'selected':''}>Unidade ${u.num} · ${u.quartos} quartos · ${u.area} m² · ${real(u.valor)}${u.cliente && u.st!=='disp' ? ' · '+esc(u.cliente) : ''}</option>`).join('')}</optgroup>` : ''; }).join('')}
        </select></label>
    </div>`}).join('') + janelaUnidade();
  },
};

// Janelas da Negociação: encaminhar para corretor e agendar reunião de fechamento
const botoesJanela = rot => `<div class="botoes"><button class="btn sec" data-fechar>Cancelar</button><button class="btn" data-confirmar>${rot}</button></div>`;
const isoData = q => `${q.getFullYear()}-${String(q.getMonth()+1).padStart(2,'0')}-${String(q.getDate()).padStart(2,'0')}`;
const numBR = s => Number(String(s).trim().replace(/\./g,'').replace(',','.'));

// Aviso rápido no canto da tela (no lugar das janelinhas do navegador)
function avisar(msg){
  document.querySelectorAll('.toast').forEach(x=>x.remove()); // mostra só o aviso mais recente
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 4500);
}

function janelaForm(){
  const j = estado.janela; if (!j) return '';
  const n = estado.negocios.find(x=>x.id===j.neg);
  if (['encaminhar','reuniao','fechar','descartar'].includes(j.tipo) && !n) return '';
  let corpo;
  const erro = j.erro ? `<p class="erro">${j.erro}</p>` : '';
  if (j.tipo==='sitio-gasto'){
    corpo = `<h2 style="margin:0">Novo gasto do sítio</h2>
      <p style="color:var(--muted);margin:4px 0 16px">O valor é dividido entre os sócios conforme a divisão da sociedade.</p>
      <div class="campos">
        <label class="largo">Descrição<input type="text" id="g-desc" placeholder="Ex.: Arame para a cerca"></label>
        <label>Categoria<select id="g-cat">${CATS_SITIO.map(k=>`<option>${k}</option>`).join('')}</select></label>
        <label>Quantidade (opcional)<input type="text" id="g-qtd" placeholder="Ex.: 3 rolos"></label>
        <label>Valor (R$)<input type="text" inputmode="decimal" id="g-valor" placeholder="0,00"></label>
        <label>Data<input type="date" id="g-data" value="${isoData(new Date())}"></label>
        <label class="largo">Quem pagou<select id="g-pago">${Object.entries(SOCIOS).map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></label>
      </div>${erro}${botoesJanela('Salvar gasto')}`;
  } else if (j.tipo==='sitio-acerto'){
    const c = contasSitio(), credor = c.lucas.saldo >= 0 ? 'lucas' : 'marcos', dev = outroSocio(credor);
    const sugerido = Math.abs(c.lucas.saldo);
    corpo = `<h2 style="margin:0">Registrar acerto</h2>
      <p style="color:var(--muted);margin:4px 0 16px">${sugerido<0.01 ? 'As contas estão em dia.' : `Hoje <b>${SOCIOS[dev]}</b> deve <b>${real2(sugerido)}</b> a ${SOCIOS[credor]}.`}</p>
      <div class="campos">
        <label class="largo">Quem pagou<select id="a-de">${Object.entries(SOCIOS).map(([k,n])=>`<option value="${k}" ${k===dev?'selected':''}>${n} pagou a ${SOCIOS[outroSocio(k)]}</option>`).join('')}</select></label>
        <label>Valor (R$)<input type="text" inputmode="decimal" id="a-valor" value="${sugerido<0.01?'':sugerido.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}"></label>
        <label>Data<input type="date" id="a-data" value="${isoData(new Date())}"></label>
        <label class="largo">Observação (opcional)<input type="text" id="a-obs" placeholder="Ex.: PIX de novembro"></label>
      </div>${erro}${botoesJanela('Registrar acerto')}`;
  } else if (j.tipo==='novo'){
    corpo = `<h2 style="margin:0">Novo interessado</h2>
      <p style="color:var(--muted);margin:4px 0 16px">O cliente entra na etapa Interessado e aguarda o Lucas encaminhar para um corretor.</p>
      <div class="campos">
        <label class="largo">Nome<input type="text" id="f-nome" placeholder="Nome do cliente" value="${esc(j.pre?.nome||"")}"></label>
        <label>Telefone / WhatsApp<input type="tel" id="f-tel" placeholder="(11) 90000-0000" value="${esc(j.pre?.tel||"")}"></label>
        <label>Origem<select id="f-origem">${ORIGENS_CLI.map(o=>`<option ${j.pre?.origem===o?'selected':''}>${o}</option>`).join('')}</select></label>
        <label class="largo">Imóvel de interesse<input type="text" id="f-imovel" list="lista-imoveis" placeholder="Escolha ou digite"></label>
        <datalist id="lista-imoveis">${estado.imoveis.map(i=>`<option value="${i.nome}">`).join('')}</datalist>
      </div>${erro}${botoesJanela('Cadastrar interessado')}`;
  } else if (j.tipo==='tarefa'){
    corpo = `<h2 style="margin:0">Nova tarefa</h2>

      <div class="campos">
        <label class="largo">Descrição<input type="text" id="f-titulo" placeholder="Ex.: Ligar para a Mariana"></label>
        <label>Data<input type="date" id="f-data" value="${isoData(new Date())}"></label>
        <label>Horário<input type="time" id="f-hora" value="${fmtHora(emMin(60))}"></label>
      </div>${erro}${botoesJanela('Criar tarefa')}`;
  } else if (j.tipo==='descartar'){
    corpo = `<h2 style="margin:0">Descartar da negociação</h2>
      <p style="color:var(--muted);margin:4px 0 16px"><b>${n.cliente}</b> sai do funil e fica guardado no Cadastro de interesse.</p>
      <div class="campos"><label class="largo">Motivo<input type="text" id="f-motivo" value="Não teve interesse"></label></div>

  } else if (j.tipo==='fechar'){

      <p style="color:var(--muted);margin:4px 0 16px"><b>${n.cliente}</b> · ${n.imovel}<br>A venda vai para Financeiro › A receber, com a entrada e as parcelas.</p>

        <label>Parcelas (0 = à vista)<input type="number" min="0" max="420" id="f-parc" value="12"></label>
      </div>${erro}${botoesJanela('Fechar negócio')}`;
  } else if (j.tipo==='novo-imovel'){

  } else if (j.tipo==='corretor'){

// Retorna um texto de erro (a janela continua aberta) ou nada (deu certo)
function confirmarJanela(){
  const j = estado.janela, n = estado.negocios.find(x=>x.id===j.neg);
  const val = id => ($('#'+id)?.value || '').trim();
  const dataDe = s => { const [a,m,d] = s.split('-').map(Number); return new Date(a,m-1,d,12); };
  if (j.tipo==='sitio-gasto'){
    const valor = numBR(val('g-valor'));
    if (!val('g-desc')) return 'Escreva a descrição do gasto.';
    if (!valor || valor<=0) return 'Informe o valor do gasto.';
    if (!val('g-data')) return 'Informe a data.';
    estado.sitio.lancamentos.push({ id:Date.now(), data:dataDe(val('g-data')), descricao:val('g-desc'), categoria:val('g-cat'), qtd:val('g-qtd'), valor, pagoPor:val('g-pago') });
    estado.sitio.filtroCat='todas'; estado.sitio.filtroMes='todos'; estado.sub.sitio='lancamentos';
    avisar(`Gasto de ${real2(valor)} registrado, pago por ${SOCIOS[val('g-pago')]}.`);
  } else if (j.tipo==='sitio-acerto'){
    const valor = numBR(val('a-valor')), de = val('a-de');
    if (!valor || valor<=0) return 'Informe o valor do acerto.';
    if (!val('a-data')) return 'Informe a data.';
    estado.sitio.acertos.push({ id:Date.now(), data:dataDe(val('a-data')), de, para:outroSocio(de), valor, obs:val('a-obs') });
    estado.sub.sitio='acertos';
    avisar(`Acerto de ${real2(valor)} registrado.`);
  } else if (j.tipo==='novo'){
    if (!val('f-nome')) return 'Preencha o nome do cliente.';
    estado.negocios.push({ id:Date.now(), cliente:val('f-nome'), tel:val('f-tel'), imovel:val('f-imovel')||'A definir', origem:val('f-origem'), etapa:'interessado' });
    if (!clientePorNome(val('f-nome'))) estado.clientes.push({ nome:val('f-nome'), tel:val('f-tel'), perfil:'Comprador', captador:null, origem:val('f-origem'), cadastro:isoData(new Date()), notas:[] });
    estado.menu = 'negociacao'; avisar(`${val('f-nome')} entrou como interessado.`);
  } else if (j.tipo==='tarefa'){
    if (!val('f-titulo')) return 'Escreva a descrição da tarefa.';
    if (!val('f-data') || !val('f-hora')) return 'Preencha a data e o horário.';
    const [a,m,d] = val('f-data').split('-').map(Number), [h,mi] = val('f-hora').split(':').map(Number);
    estado.tarefas.push({ id:Date.now(), titulo:val('f-titulo'), quando:new Date(a,m-1,d,h,mi), feita:false });
  } else if (j.tipo==='descartar'){
    estado.interesse.unshift({ cliente:n.cliente, imovel:n.imovel, saiuEm:ETAPAS.find(x=>x.id===n.etapa).nome, motivo:val('f-motivo')||'Não informado' });
    estado.negocios = estado.negocios.filter(x=>x!==n);
    avisar(`${n.cliente} foi para o Cadastro de interesse.`);
  } else if (j.tipo==='fechar'){
    const valor = numBR(val('f-valor')), nParc = parseInt(val('f-parc'),10) || 0;
    const entrada = nParc ? numBR(val('f-entrada')) : valor;
    if (!valor || valor<=0) return 'Informe o valor total da venda.';
    if (isNaN(entrada) || entrada<0) return 'Informe o valor da entrada.';
    if (entrada > valor) return 'A entrada não pode ser maior que o valor da venda.';
    if (nParc && entrada===valor) return 'Com a entrada igual ao valor total, use 0 parcelas (à vista).';
    const cap = clientePorNome(n.cliente)?.captador || n.corretor;
    const nova = montarVenda({imovel:n.imovel,cliente:n.cliente,valor,entrada,parcelas:nParc,contrato:'Contrato novo / NF —',vendedor:n.corretor,captador:cap});
    nova.data = new Date(); // fechado hoje
    estado.vendas.unshift(nova);
    estado.negocios = estado.negocios.filter(x=>x!==n);
    estado.menu='financeiro'; estado.sub.financeiro='receber';
    avisar(`Negócio fechado. A venda de ${n.cliente} foi para Financeiro › A receber.`);
  } else if (j.tipo==='corretor'){
    const e = salvarCorretor(j.d); if (e) return e;
    avisar(j.d.id ? `${j.d.nome.trim()}: dados atualizados.` : `${j.d.nome.trim()} entrou na equipe.`);
    estado.menu = 'cadastro'; estado.sub.cadastro = 'corretor';
  } else if (j.tipo==='cliente'){
    const e = salvarCliente(j.d); if (e) return e;
    const nome = j.d.nome.trim().replace(/\s+/g,' ');
    avisar(j.d.original ? `${nome}: dados atualizados.` : `${nome} cadastrado.`);
    if (!j.d.original){ estado.menu = 'clientes'; estado.aba = 'zani'; estado.filtroCli = null; }
    estado.proxJanela = { tipo:'ficha-cliente', cli:nome, focado:true };
  } else if (j.tipo==='novo-imovel'){
    const D = j.d, valor = numBR(D.valor), area = numBR(D.area), bairro = (D.bairro==='outro' ? D.bairroOutro : D.bairro || '').trim();
    if (!D.tipo) return 'Escolha o tipo de imóvel.';
    if (!valor || valor<=0) return 'Informe o valor do imóvel.';
    if (!area || area<=0) return 'Informe a área do imóvel.';
    if (!bairro) return 'Escolha ou digite o bairro.';
    const terreno = D.tipo==='Terreno', comercial = D.tipo==='Comercial';
    const q = terreno||comercial ? null : D.quartos, s = terreno||comercial ? null : D.suites;
    const tipoBase = D.tipo==='Cobertura' ? 'Apartamento' : D.tipo;
    const auto = terreno ? `Terreno ${area} m² — ${bairro}` : comercial ? `Sala comercial — ${bairro}` : D.tipo==='Cobertura' ? `Cobertura — ${bairro}`
      : `${D.tipo==='Apartamento'?'Apto':'Casa'}${q ? ' '+plural(q,'quarto','quartos') : ''} — ${bairro}`;
    const linhaQuartos = q ? plural(q,'quarto','quartos') + (s ? `, sendo ${plural(s,'suíte','suítes')}` : '') : null;
    const novo = {
      nome: D.titulo.trim() || auto, categoria: D.tipo, tipo: tipoBase, valor, area, status: D.status, captador: D.captador, cadastro: isoData(new Date()),
      endereco: `${D.endereco.trim() || 'Endereço não informado'} — ${bairro}`,
      quartos: q, suites: s, banheiros: terreno ? null : D.banheiros, vagas: terreno ? null : D.vagas,
      andar: ['Apartamento','Cobertura','Comercial'].includes(D.tipo) && D.andar.trim() ? D.andar.trim() : null,
      condominio: numBR(D.condominio) || null, terreno: D.tipo==='Casa' ? (numBR(D.terreno) || null) : null,
      frente: terreno ? (numBR(D.frente) || null) : null, fundo: terreno ? (numBR(D.fundo) || null) : null,
      descricao: D.descricao.trim(), ambientes: [linhaQuartos, ...D.ambientes].filter(Boolean), diferenciais: [...D.difs],
      foto: D.fotos[0] || null, fotosEnviadas: D.fotos.length ? [...D.fotos] : null, videos: [...D.videos], galeria: [],
    };
    estado.imoveis.push(novo);
    const F = FILTRO_VAZIO(); if (novo.status!=='Disponível') F.status = []; estado.filtroImo = F;
    estado.menu = 'imoveis'; estado.aba = 'zani'; estado.imovelAberto = estado.imoveis.length-1; estado.fotoUnid = 0;
    avisar(`${novo.nome} cadastrado.`);
  } else if (j.tipo==='venda-imovel'){
    const im = estado.imoveis[j.im], x = lerVenda(), e = erroVenda(x);
    if (e) return e;
    const meses = (x.data.getFullYear()-agora.getFullYear())*12 + (x.data.getMonth()-agora.getMonth());
    const cap = clientePorNome(im.cliente)?.captador || x.cor;
    const venda = montarVenda({imovel:im.nome, cliente:im.cliente, valor:x.valor, entrada:x.entrada, parcelas:x.nParc, inicio:meses, contrato:'Contrato novo / NF —', vendedor:x.cor, captador:cap});
    venda.data = x.data; // guarda o dia exato da venda
    estado.vendas.unshift(venda);
    im.status = 'Vendido';
    if (!clientePorNome(im.cliente)) estado.clientes.push({ nome:im.cliente, tel:'', perfil:'Comprador', captador:x.cor });
    estado.negocios = estado.negocios.filter(n=>!(n.imovel===im.nome && n.cliente===im.cliente));
    estado.menu = 'financeiro'; estado.aba = 'zani'; estado.sub.financeiro = 'vendas'; estado.mesFin = chaveMes(x.data);
    avisar(`Venda registrada: ${real2(x.valor)} em ${nomeMes(estado.mesFin).toLowerCase()}.`);
  } else if (j.tipo==='encaminhar'){
    const sel = document.querySelector('input[name=cor]:checked');
    if (!sel) return 'Escolha um corretor.';
    n.corretor = Number(sel.value);
    if (n.etapa==='interessado') n.etapa = 'potencial';
    avisar(`${n.cliente} foi encaminhado para ${nomeCor(n.corretor)}.`);
  } else {
    const data = $('#r-data').value, hora = $('#r-hora').value, local = $('#r-local').value.trim() || 'Escritório Zani Imóveis';
    if (!data || !hora) return 'Preencha a data e o horário.';
    const [a,m,d] = data.split('-').map(Number), [h,mi] = hora.split(':').map(Number);
    const quando = new Date(a,m-1,d,h,mi);
    const titulo = `Reunião de fechamento — ${n.cliente} (com Lucas e ${nomeCor(n.corretor)}) · ${local}`;
    const t = n.reuniao && estado.tarefas.find(x=>x.id===n.reuniao.tarefa);
    if (t){ t.quando = quando; t.titulo = titulo; }
    const idT = t ? t.id : Date.now();
    if (!t) estado.tarefas.push({ id:idT, titulo, quando, feita:false });
    n.reuniao = { quando, local, tarefa:idT };
    avisar('Reunião agendada e incluída nas Tarefas.');
  }
  return '';
}

const saudacao = () => { const h = new Date().getHours(); return h<12 ? 'Bom dia' : h<18 ? 'Boa tarde' : 'Boa noite'; };
const ST_UNID = { disp:'Disponível', res:'Reservada', vend:'Vendida' };

      <div class="miniaturas">${fotos.map((f,i)=>`<button class="${i===fi?'ativa':''}" data-foto-idx="${i}"><img src="${foto(f,200)}" alt="${legendas[i]}"></button>`).join('')}</div>
      <div class="janela-corpo">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div><div class="trilha">${l.nome}</div><h2 style="margin:0">Unidade ${u.num}</h2></div>
          <span class="status ${u.st==='disp'?'s-recebido':u.st==='res'?'s-receber':'s-atrasado'}">${ST_UNID[u.st]}</span>
        </div>
        <div class="info-unid">${info.map(([r,v])=>`<div><span>${r}</span><b>${v}</b></div>`).join('')}</div>
        <div class="mudar-status">

          ${u.st!=='disp' ? `<label class="cliente-unid">${u.st==='res'?'Reservada para':'Vendida para'}

            <datalist id="lista-clientes">${estado.clientes.map(c=>`<option value="${c.nome}">`).join('')}</datalist>` : ''}

}

/* detalhes do imóvel */
const vendaDoImovel = i => i.cliente ? estado.vendas.find(v=>v.imovel===i.nome && v.cliente===i.cliente) : null;
const ST_IMOVEL = [['Disponível','op-disp'],['Em negociação','op-res'],['Vendido','op-vend']];
const statusImovel = s => s==='Disponível' ? 's-recebido' : s==='Vendido' ? 's-atrasado' : 's-receber';
const plural = (n,s,p) => `${n} ${n===1?s:p}`;
function resumoImovel(i){
  const p = [];
  if (i.quartos) p.push(plural(i.quartos,'quarto','quartos'));
  if (i.banheiros) p.push(plural(i.banheiros,'banheiro','banheiros'));
  if (i.vagas) p.push(plural(i.vagas,'vaga','vagas'));
  if (i.frente) p.push(`${i.frente} x ${i.fundo} m`);
  return p.join(' · ');
}
const AMB_FOTO = { sala:'Sala de estar', cozinha:'Cozinha', quarto:'Quarto', varanda:'Varanda' };
function fotosImovel(i){
  if (i.fotosEnviadas) return i.fotosEnviadas.map((u,k)=>[u, k===0 ? 'Foto principal' : `Foto ${k+1}`]);
  if (!i.foto) return [];
  const lista = [[i.foto,i.tipo==='Terreno' ? 'Terreno' : i.tipo==='Comercial' ? 'Sala comercial' : 'Fachada']];
  (i.galeria||[]).forEach(([t,a,b])=>{
    const id = t==='sala' ? FOTOS_SALA[(a||0) % FOTOS_SALA.length] : t==='cozinha' ? FOTO_COZINHA : t==='quarto' ? FOTO_QUARTO : FOTO_VARANDA;
    const leg = t==='sala' ? (b || AMB_FOTO.sala) : (a || AMB_FOTO[t]);
    lista.push([id, leg]);
  });
  return lista;
}
function janelaImovel(){
  if (estado.imovelAberto==null) return '';
  const i = estado.imoveis[estado.imovelAberto]; if (!i) return '';
  const fotos = fotosImovel(i), fi = Math.min(estado.fotoUnid||0, fotos.length-1);
  const info = [
    ['Valor', real(i.valor)], ['Área', i.area+' m²'], ['Valor do m²', real(i.valor/i.area)],
    i.quartos!=null && ['Quartos', i.quartos + (i.suites ? ` (${plural(i.suites,'suíte','suítes')})` : '')],

/* filtros dos imóveis */
const TIPOS_IMO = ['Apartamento','Casa','Cobertura','Terreno','Comercial'];
const categoriaImovel = i => i.categoria || (/cobertura/i.test(i.nome) ? 'Cobertura' : i.tipo);
const bairroDe = i => (i.endereco||'').split('—').pop().trim();
const DIFS_FILTRO = [['piscina','Piscina'],['gourmet','Área gourmet'],['financiamento','Aceita financiamento'],['portaria','Portaria 24 horas'],['elevador','Elevador']];
const temDif = (i,k) => [...(i.diferenciais||[]),...(i.ambientes||[])].join(' ').toLowerCase().includes(k);
const FAIXAS_VALOR = [['Até 300 mil',null,300000],['300 a 600 mil',300000,600000],['600 mil a 1 milhão',600000,1000000],['Acima de 1 milhão',1000000,null]];
const ORDENS_IMO = [['recentes','Mais recentes'],['menor','Menor preço'],['maior','Maior preço'],['area','Maior área'],['m2','Menor valor do m²']];
const FILTRO_VAZIO = () => ({ tipos:[], vmin:null, vmax:null, status:['Disponível'], quartos:0, vagas:0, bairro:'', amin:null, amax:null, suite:false, difs:[], captador:0, ordem:'recentes', paraCliente:null });
const filtroImo = () => estado.filtroImo || (estado.filtroImo = FILTRO_VAZIO());
function imoveisFiltrados(F = filtroImo()){
  const ok = i =>
    (!F.tipos.length || F.tipos.includes(categoriaImovel(i))) &&
    (F.vmin==null || i.valor>=F.vmin) && (F.vmax==null || i.valor<=F.vmax) &&
    (!F.status.length || F.status.includes(i.status)) &&
    (!F.quartos || (i.quartos||0)>=F.quartos) && (!F.vagas || (i.vagas||0)>=F.vagas) &&
    (!F.bairro || bairroDe(i)===F.bairro) &&
    (F.amin==null || i.area>=F.amin) && (F.amax==null || i.area<=F.amax) &&
    (!F.suite || (i.suites||0)>0) && F.difs.every(k=>temDif(i,k)) &&
    (!F.captador || i.captador===F.captador);
  const ord = { recentes:(a,b)=>(b.cadastro||'').localeCompare(a.cadastro||''), menor:(a,b)=>a.valor-b.valor, maior:(a,b)=>b.valor-a.valor,
                area:(a,b)=>b.area-a.area, m2:(a,b)=>a.valor/a.area-b.valor/b.area }[F.ordem] || (()=>0);
  return estado.imoveis.filter(ok).sort(ord);
}
const milhar = v => v>=1000000 ? (v/1000000).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi' : (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil';
const faixaTexto = (a,b,fmt) => a!=null && b!=null ? `${fmt(a)} a ${fmt(b)}` : a!=null ? `acima de ${fmt(a)}` : `até ${fmt(b)}`;
function tagsFiltro(){
  const F = filtroImo(), t = [];
  F.tipos.forEach(x=>t.push([x,'tipos:'+x]));
  if (F.vmin!=null || F.vmax!=null) t.push(['R$ '+faixaTexto(F.vmin,F.vmax,milhar),'valor']);
  if (!(F.status.length===1 && F.status[0]==='Disponível')) t.push([F.status.length ? F.status.join(', ') : 'Todos os status','status']);
  if (F.quartos) t.push([F.quartos+'+ quartos','quartos']);
  if (F.vagas) t.push([F.vagas+'+ vagas','vagas']);
  if (F.suite) t.push(['Com suíte','suite']);
  if (F.bairro) t.push([F.bairro,'bairro']);
  if (F.amin!=null || F.amax!=null) t.push(['Área '+faixaTexto(F.amin,F.amax,v=>v+' m²'),'area']);
  F.difs.forEach(k=>t.push([DIFS_FILTRO.find(d=>d[0]===k)[1],'difs:'+k]));
  if (F.captador) t.push(['Captado por '+nomeCor(F.captador),'captador']);
  return t;
}
const qtdFiltros = () => tagsFiltro().length;
function tirarFiltro(k){
  const F = filtroImo(), [c,v] = k.split(':');
  if (c==='tipos' || c==='difs') F[c] = F[c].filter(x=>x!==v);
  else if (c==='valor'){ F.vmin = F.vmax = null; }
  else if (c==='area'){ F.amin = F.amax = null; }
  else if (c==='status') F.status = ['Disponível'];
  else if (c==='suite') F.suite = false;
  else if (c==='bairro') F.bairro = '';
  else F[c] = 0;
  F.paraCliente = null;
}
function textoBusca(b){
  if (!b) return '';
  const p = [];
  if (b.tipos?.length) p.push(b.tipos.join(' ou '));
  if (b.vmin!=null || b.vmax!=null) p.push('R$ '+faixaTexto(b.vmin??null,b.vmax??null,milhar));
  if (b.quartos) p.push(b.quartos+'+ quartos');
  if (b.vagas) p.push(b.vagas+'+ vagas');
  if (b.bairro) p.push(b.bairro);
  (b.difs||[]).forEach(k=>p.push(DIFS_FILTRO.find(d=>d[0]===k)[1]));
  return p.join(' · ');
}
function aplicarBusca(nome){
  const b = clientePorNome(nome)?.busca || {}, F = FILTRO_VAZIO();
  Object.assign(F, { tipos:[...(b.tipos||[])], vmin:b.vmin??null, vmax:b.vmax??null, quartos:b.quartos||0, vagas:b.vagas||0, bairro:b.bairro||'', difs:[...(b.difs||[])], paraCliente:nome });
  estado.filtroImo = F;
}

function salvarCliente(D){
  const nome = D.nome.trim().replace(/\s+/g,' '), tel = D.tel.trim();
  if (!nome) return 'Preencha o nome do cliente.';
  if (tel.replace(/\D/g,'').length < 10) return 'Preencha o telefone com DDD (10 ou 11 números).';
  const outro = estado.clientes.find(c=>c.nome.toLowerCase()===nome.toLowerCase() && c.nome!==D.original);
  if (outro) return 'Já existe um cliente com esse nome.';
  const vmin = D.vmin.trim() ? numBR(D.vmin) : null, vmax = D.vmax.trim() ? numBR(D.vmax) : null;
  if ((vmin!=null && isNaN(vmin)) || (vmax!=null && isNaN(vmax))) return 'Confira a faixa de valor.';
  if (vmin!=null && vmax!=null && vmin>vmax) return 'O valor mínimo está maior que o máximo.';
  const temBusca = procuraImovel(D.perfil) && (D.bTipos.length || vmin!=null || vmax!=null || D.bQuartos || D.bVagas || D.bBairro || D.bDifs.length);
  const busca = temBusca ? { tipos:[...D.bTipos], vmin, vmax, quartos:D.bQuartos||0, vagas:D.bVagas||0, bairro:D.bBairro||'', difs:[...D.bDifs] } : null;
  let c = D.original ? clientePorNome(D.original) : null;
  if (!c){ c = { cadastro: isoData(new Date()), notas: [] }; estado.clientes.push(c); }
  if (D.original && D.original!==nome){ // renomeia em todo o app
    estado.negocios.forEach(x=>{ if (x.cliente===D.original) x.cliente = nome; });
    estado.vendas.forEach(x=>{ if (x.cliente===D.original) x.cliente = nome; });
    estado.imoveis.forEach(x=>{ if (x.cliente===D.original) x.cliente = nome; });
    estado.interesse.forEach(x=>{ if (x.cliente===D.original) x.cliente = nome; });
  }
  Object.assign(c, { nome, tel, email:D.email.trim(), nascimento:D.nascimento, perfil:D.perfil, origem:D.origem, captador:D.captador||null, busca });
  if (D.obs.trim()){ c.notas = c.notas || []; c.notas.unshift({ data: isoData(new Date()), texto: D.obs.trim() }); }
  return '';
}

const mesDe = d => d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
function contasSitio(){
  const S = estado.sitio, total = S.lancamentos.reduce((s,l)=>s+l.valor,0);
  const pct = { lucas:S.parte/100, marcos:1-S.parte/100 };
  const r = {};
  for (const s of ['lucas','marcos']){
    const pago = S.lancamentos.filter(l=>l.pagoPor===s).reduce((a,l)=>a+l.valor,0);
    const deu = S.acertos.filter(a=>a.de===s).reduce((a,x)=>a+x.valor,0);
    const recebeu = S.acertos.filter(a=>a.para===s).reduce((a,x)=>a+x.valor,0);
    r[s] = { pago, parte: total*pct[s], saldo: pago - total*pct[s] + deu - recebeu };
  }
  return { total, ...r };
}
function telaSitio(){
  const S = estado.sitio, c = contasSitio(), sub = estado.sub.sitio || 'lancamentos';
  const credor = c.lucas.saldo >= 0 ? 'lucas' : 'marcos', valorSaldo = Math.abs(c.lucas.saldo);
  const emDia = valorSaldo < 0.01;
  const pctL = S.parte, pctM = 100 - S.parte;
  let corpo;

  if (sub==='lancamentos'){
    const meses = [...new Set([...S.lancamentos].sort((a,b)=>b.data-a.data).map(l=>mesDe(l.data)))];
    const lista = S.lancamentos.filter(l => (S.filtroCat==='todas' || l.categoria===S.filtroCat) && (S.filtroMes==='todos' || mesDe(l.data)===S.filtroMes))
                               .sort((a,b)=>b.data-a.data);
    const soma = lista.reduce((s,l)=>s+l.valor,0);
    corpo = `<div class="filtros">
        <label>Categoria<select id="filtro-cat" data-filtro-sitio="filtroCat"><option value="todas">Todas</option>${CATS_SITIO.map(k=>`<option ${S.filtroCat===k?'selected':''}>${k}</option>`).join('')}</select></label>
        <label>Mês<select id="filtro-mes" data-filtro-sitio="filtroMes"><option value="todos">Todos</option>${meses.map(m=>`<option ${S.filtroMes===m?'selected':''}>${m}</option>`).join('')}</select></label>
        <span class="filtros-total">${lista.length} lançamento${lista.length===1?'':'s'} · <b>${real2(soma)}</b></span>
      </div>
      <div class="lista-mob">${lista.map(l=>`<div class="item-mob">
          <div class="l1"><b>${l.descricao}</b><b class="valor">${real2(l.valor)}</b></div>
          <div class="l2"><span>${fmtData(l.data)}</span><span class="tag cat-${CATS_SITIO.indexOf(l.categoria)}">${l.categoria}</span>${l.qtd?`<span>${l.qtd}</span>`:''}</div>
          <div class="l2"><span>Pago por <span class="socio s-${l.pagoPor}">${SOCIOS[l.pagoPor].split(' ')[0]}</span></span><span class="dir">Lucas ${real2(l.valor*pctL/100)} · Marcos ${real2(l.valor*pctM/100)}</span></div>
        </div>`).join('') || '<p style="color:var(--muted)">Nenhum lançamento com esses filtros.</p>'}</div>
      <div class="rolagem so-desktop"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Quantidade</th><th>Pago por</th><th class="num">Valor</th><th class="num">Parte Lucas (${pctL}%)</th><th class="num">Parte Marcos (${pctM}%)</th></tr></thead><tbody>
      ${lista.map(l=>`<tr><td>${fmtData(l.data)}</td><td><b>${l.descricao}</b></td><td><span class="tag cat-${CATS_SITIO.indexOf(l.categoria)}">${l.categoria}</span></td><td>${l.qtd||'—'}</td>
        <td><span class="socio s-${l.pagoPor}">${SOCIOS[l.pagoPor].split(' ')[0]}</span></td><td class="num"><b>${real2(l.valor)}</b></td>
        <td class="num">${real2(l.valor*pctL/100)}</td><td class="num">${real2(l.valor*pctM/100)}</td></tr>`).join('') || `<tr><td colspan="8" style="color:var(--muted)">Nenhum lançamento com esses filtros.</td></tr>`}
      </tbody></table></div>`;
  }

  if (sub==='categorias'){
    const porCat = CATS_SITIO.map(k=>({k, v:S.lancamentos.filter(l=>l.categoria===k).reduce((s,l)=>s+l.valor,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    const max = Math.max(...porCat.map(x=>x.v), 1);
    corpo = `<div class="cats">${porCat.map(x=>`<div class="cat-linha">
        <span class="cat-nome">${x.k}</span>
        <div class="cat-barra"><div style="width:${x.v/max*100}%"></div></div>
        <span class="cat-valor">${real2(x.v)}</span><span class="cat-pct">${Math.round(x.v/c.total*100)}%</span></div>`).join('')}</div>`;
  }

  if (sub==='acertos'){
    corpo = `<p style="color:var(--muted);margin:0 0 12px">Acerto é quando um sócio paga ao outro para equilibrar as contas da sociedade.</p>
      <div class="rolagem"><table><thead><tr><th>Data</th><th>Quem pagou</th><th>Quem recebeu</th><th>Observação</th><th class="num">Valor</th></tr></thead><tbody>
      ${[...S.acertos].sort((a,b)=>b.data-a.data).map(a=>`<tr><td>${fmtData(a.data)}</td><td>${SOCIOS[a.de]}</td><td>${SOCIOS[a.para]}</td><td>${a.obs||'—'}</td><td class="num"><b>${real2(a.valor)}</b></td></tr>`).join('') || `<tr><td colspan="5" style="color:var(--muted)">Nenhum acerto registrado.</td></tr>`}
      </tbody></table></div>`;
  }

  return cab('Financeiro do sítio', `Prestação de contas da sociedade entre ${SOCIOS.lucas} e ${SOCIOS.marcos}: materiais, gastos e custos.`,
      `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" data-acao-sitio="acerto">Registrar acerto</button><button class="btn" data-acao-sitio="gasto">+ Novo gasto</button></div>`) + `
    <div class="sociedade">
      <span>Divisão da sociedade</span>
      <label>${SOCIOS.lucas} <input type="number" id="parte-lucas" min="0" max="100" step="1" value="${pctL}" data-parte-sitio> %</label>
      <span class="sep">·</span>
      <span>${SOCIOS.marcos} <b>${pctM} %</b></span>
    </div>
    <div class="grade g4" style="margin-bottom:16px">
      ${kpi('Total de gastos', real2(c.total), S.lancamentos.length+' lançamentos', 'var(--amarelo)')}
      ${kpi(SOCIOS.lucas+' pagou', real2(c.lucas.pago), `a parte dele é ${real2(c.lucas.parte)}`, 'var(--azul)')}
      ${kpi(SOCIOS.marcos+' pagou', real2(c.marcos.pago), `a parte dele é ${real2(c.marcos.parte)}`, 'var(--laranja)')}
      <div class="cartao kpi saldo ${emDia?'ok':''}"><div class="faixa" style="background:${emDia?'var(--verde)':'var(--vermelho)'}"></div>
        <div class="rot">Saldo entre os sócios</div>
        <div class="val">${emDia ? 'Em dia' : real2(valorSaldo)}</div>
        <div class="det">${emDia ? 'ninguém deve nada' : `${SOCIOS[outroSocio(credor)]} deve a ${SOCIOS[credor]} (já descontados os acertos)`}</div></div>
    </div>
    <div class="cartao">
      ${subabas('sitio',[['lancamentos','Lançamentos'],['categorias','Por categoria'],['acertos','Acertos entre sócios']],sub)}
      ${corpo}
    </div>`;
}

/* janela "Registrar venda" do imóvel */
function lerVenda(){
  const val = id => ($('#'+id)?.value || '').trim();
  const avista = document.querySelector('input[name=v-forma]:checked')?.value === 'vista';
  const valor = numBR(val('v-valor'));
  const nParc = avista ? 0 : parseInt(val('v-parc'),10);
  const entrada = avista ? valor : numBR(val('v-entrada'));
  const [a,m,d] = val('v-data').split('-').map(Number);
  const data = a ? new Date(a,m-1,d,12) : null;
  return { avista, valor, nParc, entrada, data, cor:Number(val('v-cor')) };
}
function erroVenda(x){
  if (!x.valor || x.valor<=0) return 'Informe o valor negociado.';
  if (!x.avista){
    if (isNaN(x.entrada) || x.entrada<0) return 'Informe o valor da entrada (pode ser 0).';
    if (x.entrada >= x.valor) return 'A entrada precisa ser menor que o valor negociado. Se foi pago tudo de uma vez, marque À vista.';
    if (!x.nParc || x.nParc<1) return 'Informe o número de parcelas (1 ou mais).';
    if (x.nParc>420) return 'O número máximo de parcelas é 420.';
  }
  if (!x.data) return 'Informe a data da venda.';
  return '';
}
function atualizarVenda(){
  const x = lerVenda(), bloco = $('#bloco-parc'), p = $('#v-previa'); if (!p) return;
  if (bloco) bloco.hidden = x.avista;
  if (erroVenda(x)){ p.innerHTML = '<span style="color:var(--muted)">Preencha os campos para ver o resumo.</span>'; return; }
  const parc = x.nParc ? (x.valor-x.entrada)/x.nParc : 0;
  p.innerHTML = `<div><span>Forma</span><b>${x.avista ? 'À vista: '+real2(x.valor) : `Entrada de ${real2(x.entrada)} + ${x.nParc}x de ${real2(parc)}`}</b></div>
    <div><span>Comissão (${+(TAXA_PADRAO*100).toFixed(2)}%)</span><b>${real2(x.valor*TAXA_PADRAO)}</b></div>
    <div><span>Entra no Financeiro de</span><b>${nomeMes(chaveMes(x.data))}</b></div>`;
}

document.addEventListener('click', e=>{

  if (e.target.matches('[data-fechar-mais]')){ estado.mais=false; render(); return; }

  else if (d.msgEscolha!==undefined){ estado.janela.msg = Number(d.msgEscolha); }
  else if (d.msgVoltar!==undefined){ if (estado.janela.msg!=null) estado.janela.msg = null; else estado.janela.cat = null; }
  else if (d.copiarMsg!==undefined){
    const t = $('#texto-msg'); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(()=>avisar('Texto copiado.'), ()=>{ try { document.execCommand('copy'); avisar('Texto copiado.'); } catch(_){ avisar('Selecione o texto e copie manualmente.'); } });
    return;
  }
  else if (d.limparFiltros!==undefined){ const o = filtroImo().ordem; estado.filtroImo = FILTRO_VAZIO(); estado.filtroImo.ordem = o; }
  else if (d.tiraFiltro){ tirarFiltro(d.tiraFiltro); }
  else if (d.paraCliente){ aplicarBusca(d.paraCliente); estado.janela = null; estado.menu = 'imoveis'; estado.aba = 'zani'; render(); $('#conteudo').scrollTop = 0; return; }
  else if (d.fTipo || d.fFaixa!==undefined || d.fStatus || d.fQuartos!==undefined || d.fVagas!==undefined || d.fSuite || d.fDif){
    const F = filtroImo(), alterna = (lista,v) => lista.includes(v) ? lista.filter(x=>x!==v) : [...lista,v];
    if (d.fTipo) F.tipos = alterna(F.tipos, d.fTipo);
    if (d.fFaixa!==undefined){ const [,a,b] = FAIXAS_VALOR[d.fFaixa]; const igual = F.vmin===a && F.vmax===b; F.vmin = igual?null:a; F.vmax = igual?null:b; }
    if (d.fStatus) F.status = alterna(F.status, d.fStatus);
    if (d.fQuartos!==undefined) F.quartos = Number(d.fQuartos);
    if (d.fVagas!==undefined) F.vagas = Number(d.fVagas);
    if (d.fSuite) F.suite = !F.suite;
    if (d.fDif) F.difs = alterna(F.difs, d.fDif);
    F.paraCliente = null;
  }
  else if (d.okVenda!==undefined && estado.imovelAberto!=null){

    estado.janela = { tipo:'venda-imovel', im: estado.imovelAberto }; estado.imovelAberto = null;
  }
  else if (d.confirmar!==undefined){

      if (p) p.textContent = erro; else document.querySelector('.janela .botoes').insertAdjacentHTML('beforebegin', `<p class="erro">${erro}</p>`);
      return; } // mostra o erro sem apagar o que foi digitado
    estado.janela = estado.proxJanela || null; estado.proxJanela = null;
  }
  else if (d.encaminhar){ estado.janela = { tipo:'encaminhar', neg:Number(d.encaminhar) }; }
  else if (d.reuniao){ estado.janela = { tipo:'reuniao', neg:Number(d.reuniao) }; }
  else if (d.statusUnid){
    const [li,ui] = estado.unidade, u = estado.lancamentos[li].unidades[ui];
    u.st = d.statusUnid; if (u.st==='disp') u.cliente = '';
  }
  else if (d.statusImovel && estado.imovelAberto!=null){
    const im = estado.imoveis[estado.imovelAberto];
    if (im.status!==d.statusImovel){ im.status = d.statusImovel; if (im.status==='Disponível') im.cliente = ''; avisar(`${im.nome}: ${im.status.toLowerCase()}`); }
  }
  else if (d.fotoIdx){ estado.fotoUnid = Number(d.fotoIdx); }
  else if (d.aba){ const mudou = estado.aba!==d.aba; estado.aba = d.aba; estado.mais=false; if (mudou){ render(); $('#conteudo').scrollTop = 0; return; } }
  else if (d.mais!==undefined){ estado.mais = !estado.mais; }
  else if (d.etapaMob){ estado.etapaMob = d.etapaMob; }

      n.etapa = ETAPAS[i+1].id;
    }
    else { estado.janela = { tipo:'fechar', neg:n.id }; } // fechamento → contrato/NF → a receber
  }
  else if (d.perder){ estado.janela = { tipo:'descartar', neg:Number(d.perder) }; }
  else if (d.abrir){ const v=estado.vendas[d.abrir]; estado.abertos.has(v) ? estado.abertos.delete(v) : estado.abertos.add(v); }
  else if (d.pagar){ const [vi,pi]=d.pagar.split(':'); const p=estado.vendas[vi].pagamentos[pi]; p.pago=!p.pago; }
  else if (d.tarefa){ const t=estado.tarefas.find(x=>x.id==d.tarefa); t.feita=b.checked; }
  else if (d.acaoSitio){ estado.janela = { tipo:'sitio-'+d.acaoSitio }; }
  else if (d.acao==='novo-negocio'){ estado.janela = { tipo:'novo' }; }
  else if (d.acao==='nova-tarefa'){ estado.janela = { tipo:'tarefa' }; }
  else if (d.acao==='novo-cliente' || (d.acao==='cadastrar' && (estado.sub.cadastro||'clientes')==='clientes')){
    estado.janela = { tipo:'cliente', d: rascunhoCliente(null), focado:true };
  }
  else if (d.acao==='cadastrar' && estado.sub.cadastro==='corretor'){ estado.janela = { tipo:'corretor', d: rascunhoCorretor(null), focado:true }; }
  else if (d.editarCor){ estado.janela = { tipo:'corretor', d: rascunhoCorretor(corretor(Number(d.editarCor))), focado:true }; }
  else if (d.ficha){ estado.janela ={ tipo:'ficha-cliente', cli:d.ficha, focado:true }; }
  else if (d.editarCli){ estado.janela = { tipo:'cliente', d: rascunhoCliente(clientePorNome(d.editarCli)), focado:true, animou:true }; }
  else if (d.iniciarNeg){ const c = clientePorNome(d.iniciarNeg); estado.janela = { tipo:'novo', pre:{ nome:c.nome, tel:c.tel, origem:c.origem } }; }
  else if (d.irNeg!==undefined){ estado.janela = null; estado.menu = 'negociacao'; render(); $('#conteudo').scrollTop = 0; return; }
  else if (d.irFin!==undefined){ estado.janela = null; estado.menu = 'financeiro'; estado.sub.financeiro = 'receber'; estado.mesFin = 'todos'; render(); $('#conteudo').scrollTop = 0; return; }
  else if (d.notaCli){
    const c = clientePorNome(d.notaCli), t = ($('#nova-nota')?.value || '').trim();
    if (!t){ $('#nova-nota').focus(); return; }
    c.notas = c.notas || []; c.notas.unshift({ data: isoData(new Date()), texto: t }); avisar('Anotação salva.');
  }
  else if (d.fcli){ const [k,v] = d.fcli.split('|'); filtroCli()[k] = v; }
  else if (d.msgDireta){ const [cli,cat,msg] = d.msgDireta.split('|'); estado.janela = { tipo:'mensagens', cli, cat, msg:Number(msg), focado:true }; }
  else if (d.acao==='novo-imovel' || (d.acao==='cadastrar' && estado.sub.cadastro==='imoveis')){
    estado.janela = { tipo:'novo-imovel', d: novoRascunho(), focado:true }; estado.imovelAberto = null; estado.filtrosAbertos = false;
  }
  else if ((d.ni || d.niMulti || d.niAdd || d.niTira || d.niCapa!==undefined) && estado.janela?.d){
    const D = estado.janela.d;
    if (d.ni){ const [c,v] = d.ni.split('|'), n = ['quartos','suites','banheiros','vagas','captador','bQuartos','bVagas'].includes(c), val = n ? Number(v) : v;
      D[c] = (n && c!=='captador' && D[c]===val) ? null : val; }
    if (d.niMulti){ const [c,v] = d.niMulti.split('|'); D[c] = D[c].includes(v) ? D[c].filter(x=>x!==v) : [...D[c], v]; }
    if (d.niAdd){ const inp = $('#ni-add-'+d.niAdd), v = inp.value.trim(); if (!v){ inp.focus(); return; } if (!D[d.niAdd].includes(v)) D[d.niAdd].push(v); }
    if (d.niTira){ const [c,k] = d.niTira.split('|'); const [u] = D[c].splice(Number(k),1); }
    if (d.niCapa!==undefined){ const [u] = D.fotos.splice(Number(d.niCapa),1); D.fotos.unshift(u); }
  }
  else if (d.acao){ avisar('Esta função será montada na próxima etapa.'); return; }
  else if (b.id==='btnMenu'){ $('#lateral').classList.toggle('aberta'); return; }
  else return;
  render();
});

document.addEventListener('keydown', e=>{ if (e.key==='Escape' && (estado.unidade || estado.imovelAberto!=null || estado.janela || estado.filtrosAbertos)){ estado.unidade=null; estado.imovelAberto=null; estado.janela=null; estado.filtrosAbertos=false; render(); } });
document.addEventListener('change', e=>{
  if (e.target.dataset.ordemImo!==undefined){ filtroImo().ordem = e.target.value; render(); return; }
  if (e.target.dataset.selUnidade!==undefined){ if (e.target.value==='') return; estado.unidade = [Number(e.target.dataset.selUnidade), Number(e.target.value)]; estado.fotoUnid = 0; render(); return; }
  if (e.target.dataset.fcliSel){ filtroCli()[e.target.dataset.fcliSel] = e.target.value; const l = $('#lista-clientes'); if (l) l.innerHTML = listaClientesHTML(); return; }
  if (e.target.dataset.fSel){ const F = filtroImo(), k = e.target.dataset.fSel; F[k] = k==='captador' ? Number(e.target.value) : e.target.value; F.paraCliente = null; render(); return; }
  if (e.target.dataset.fNum){ render(); return; } // valores já guardados ao digitar; redesenha para atualizar as etiquetas
  if (e.target.dataset.formaVenda!==undefined){ atualizarVenda(); return; }
  if (e.target.dataset.clienteImovel!==undefined && estado.imovelAberto!=null){ estado.imoveis[estado.imovelAberto].cliente = e.target.value.trim(); return; }
  if (e.target.dataset.clienteUnid!==undefined && estado.unidade){
    const [li,ui] = estado.unidade; estado.lancamentos[li].unidades[ui].cliente = e.target.value.trim(); return;
  }
  if (e.target.dataset.mesFin!==undefined){ estado.mesFin = e.target.value; render(); return; }
  const fs = e.target.dataset.filtroSitio;
  if (fs){ estado.sitio[fs] = e.target.value; render(); return; }
  if (e.target.dataset.parteSitio!==undefined){
    const v = Math.round(Number(e.target.value)); if (isNaN(v)||v<0||v>100) return;
    estado.sitio.parte = v; render(); return;
  }
  const ic2 = e.target.dataset.taxaCap;
  if (ic2!==undefined){ const v = Number(e.target.value); if (isNaN(v)||v<0||v>100) return; estado.vendas[ic2].taxaCaptacao = v/100; render(); return; }
  const i = e.target.dataset.taxa; if (i===undefined) return;
  const v = Number(e.target.value); if (isNaN(v) || v<0 || v>100) return;
  estado.vendas[i].taxa = v/100; render();
});

$('#hoje').textContent = agora.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
setInterval(()=>{ if (!estado.janela && !estado.unidade && estado.imovelAberto==null && !estado.filtrosAbertos) render(); }, 60000); // atualiza os avisos das tarefas a cada minuto (sem apagar formulário aberto)
render();
</script>
